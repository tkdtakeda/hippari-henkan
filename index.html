<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引張試験ファイル 変換 ＋ 解析</title>
<!-- 外部ネットワークは一切参照しない（file:// で開いてそのまま動く） -->
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">
  <!-- ============ アプリバー ============ -->
  <header class="appbar">
    <div class="appbar__title">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20h18"/><path d="M3 20V4"/>
          <path d="M4 17c2.2 0 3.2-8 5-8s2.4 5 4 5 3.2-3 7-9"/>
        </svg>
      </span>
      <div>
        <h1>引張試験ファイル 変換 ＋ 解析</h1>
        <p class="appbar__sub">.xtux / .vtav / .csv → CSV・線図・機械的特性値　｜　通信なし・ブラウザ内で完結</p>
      </div>
    </div>

    <div class="appbar__actions">
      <button class="btn btn--ghost" id="btnSettings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        設定
      </button>

      <div class="menu-wrap">
        <button class="btn btn--ghost btn--icon" id="btnMore" aria-haspopup="menu" aria-expanded="false" title="その他の操作">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
          <span class="sr-only">その他の操作</span>
        </button>
        <div class="menu" id="moreMenu" role="menu" hidden>
          <button role="menuitem" data-act="export-settings">設定を JSON で書き出す</button>
          <button role="menuitem" data-act="import-settings">設定を JSON から読み込む</button>
          <hr>
          <button role="menuitem" data-act="clear-results" id="miClearResults">変換結果だけを消す（入力は残す）</button>
          <button role="menuitem" class="menu__danger" data-act="clear-all" id="miClearAll">すべて削除</button>
          <p class="menu__note">削除は実行後に「取り消し」できます。</p>
        </div>
      </div>

      <!-- 主要動作は常にこの 1 つ（位置固定・ラベルだけが変わる） -->
      <div class="cta-wrap">
        <button class="btn btn--primary" id="cta" aria-describedby="ctaNote"></button>
        <p class="cta-note" id="ctaNote"></p>
      </div>
    </div>
  </header>

  <!-- ============ 本体 ============ -->
  <div class="layout" id="layout" data-empty="true">
    <aside class="rail" aria-label="入力ファイル">
      <div class="rail__head">
        <div class="dropzone" id="dzMini" tabindex="0" role="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          ファイルを追加（ドロップ / クリック）
        </div>
      </div>
      <div class="rail__scroll" id="fileList" role="listbox" aria-label="ファイル一覧"></div>
      <footer class="rail__foot" id="railFoot"></footer>
    </aside>

    <section class="stage" id="stage"></section>
  </div>
</div>

<div class="toast-area" id="toasts" aria-live="polite"></div>

<div class="dropoverlay" id="dropOverlay" hidden>
  <div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    ここにドロップして読み込む
    <small>.xtux / .vtav（変換＋解析）・.csv（解析のみ）</small>
  </div>
</div>

<input type="file" id="filePicker" multiple accept=".xtux,.vtav,.csv,.CSV,.XTUX,.VTAV" hidden>
<input type="file" id="settingsPicker" accept=".json,application/json" hidden>

<dialog id="dlgSettings" aria-labelledby="dlgTitle">
  <form method="dialog" class="dlg">
    <div class="dlg__head">
      <span class="dlg__title" id="dlgTitle">解析パラメータと出力の設定</span>
      <div class="card__tools">
        <button class="btn btn--plain btn--sm" value="close" type="submit">閉じる</button>
      </div>
    </div>
    <div class="dlg__body" id="dlgBody"></div>
    <div class="dlg__foot">
      <button class="btn btn--plain" type="button" id="btnResetParams">既定値に戻す</button>
      <span class="muted" style="font-size:var(--fs-1)">変更するとその場で全ファイルを再解析します（変換のやり直しは不要）。</span>
      <span class="spacer"></span>
      <button class="btn btn--primary" value="close" type="submit">閉じる</button>
    </div>
  </form>
</dialog>

<script src="assets/js/util.js"></script>
<script src="assets/js/binary.js"></script>
<script src="assets/js/parser.js"></script>
<script src="assets/js/csv.js"></script>
<script src="assets/js/zip.js"></script>
<script src="assets/js/analysis.js"></script>
<script src="assets/js/chart.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
