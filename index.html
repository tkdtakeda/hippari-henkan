<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>引張試験ファイル 変換 ＋ 解析</title>
<style>
/* ============================================================
   デザイントークン（基本設計 7: 見た目の値はトークンから選ぶ）
   コンポーネント側で生の px / カラーコードは書かない。
   ============================================================ */
:root{
  color-scheme: light;

  /* ---- パレット: メイン = 深い青 ---- */
  --blue-950:#061a35;
  --blue-900:#0a2647;
  --blue-800:#0f3462;
  --blue-700:#14427c;
  --blue-600:#1c5596;
  --blue-500:#2a6db5;
  --blue-400:#5891cd;
  --blue-300:#8fb6de;
  --blue-200:#c2d8ec;
  --blue-100:#e2ecf7;
  --blue-050:#f1f6fc;

  /* ---- パレット: アクセント = ティール（青と同系で調和する寒色） ---- */
  --teal-800:#075353;
  --teal-700:#0b6a68;
  --teal-600:#0e807c;
  --teal-500:#159c95;
  --teal-100:#dcf1ef;

  /* ---- パレット: 状態色（彩度を落として深い青と調和させる） ---- */
  --green-700:#15613d;
  --green-600:#1c7a4d;
  --green-100:#e1f1e8;
  --amber-700:#8a5806;
  --amber-600:#a56a09;
  --amber-100:#fbeed6;
  --red-700:#93201a;
  --red-600:#b3271f;
  --red-100:#fbe3e1;

  /* ---- パレット: ニュートラル（青みを含ませてベースを調和させる） ---- */
  --n-0:#ffffff;
  --n-25:#fafcfe;
  --n-50:#f4f7fb;
  --n-100:#eaeff6;
  --n-200:#dbe3ee;
  --n-300:#c2cddd;
  --n-400:#93a2b8;
  --n-500:#6b7a91;
  --n-600:#4d5b70;
  --n-700:#38445a;
  --n-800:#232e41;
  --n-900:#141c2a;

  /* ---- セマンティック ---- */
  --bg: var(--n-50);
  --surface: var(--n-0);
  --surface-2: var(--n-25);
  --surface-sunken: var(--n-100);
  --border: var(--n-200);
  --border-strong: var(--n-300);
  --text: var(--n-800);
  --text-muted: var(--n-500);
  --text-on-dark: #ffffff;

  --primary: var(--blue-900);
  --primary-hover: var(--blue-800);
  --primary-active: var(--blue-950);
  --primary-soft: var(--blue-100);
  --primary-soft-2: var(--blue-050);
  --primary-text: var(--blue-800);
  --accent: var(--teal-600);
  --accent-soft: var(--teal-100);
  --accent-text: var(--teal-800);
  --focus: var(--blue-500);

  --ok: var(--green-600);
  --ok-text: var(--green-700);
  --ok-bg: var(--green-100);
  --warn: var(--amber-600);
  --warn-text: var(--amber-700);
  --warn-bg: var(--amber-100);
  --err: var(--red-600);
  --err-text: var(--red-700);
  --err-bg: var(--red-100);
  --na: var(--n-500);
  --na-bg: var(--n-100);

  /* ---- 余白 ---- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;

  /* ---- 角丸 ---- */
  --r-1:4px; --r-2:8px; --r-3:12px; --r-pill:999px;

  /* ---- 文字 ---- */
  --font: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", "Meiryo",
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: "SFMono-Regular", "Consolas", "Roboto Mono", "Courier New", monospace;
  --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:15px; --fs-5:18px; --fs-6:21px;
  --lh-tight:1.25; --lh:1.55;
  --fw-normal:400; --fw-med:600; --fw-bold:700;

  /* ---- 高さ ---- */
  --h-ctl:30px; --h-ctl-lg:38px; --h-appbar:66px; --h-tab:38px;

  /* ---- 影 ---- */
  --sh-1: 0 1px 2px rgba(10,38,71,.06), 0 1px 1px rgba(10,38,71,.04);
  --sh-2: 0 2px 8px rgba(10,38,71,.10);
  --sh-3: 0 12px 32px rgba(10,38,71,.20);
  --ring: 0 0 0 3px rgba(42,109,181,.35);

  /* ---- モーション ---- */
  --dur-1:110ms; --dur-2:180ms; --ease: cubic-bezier(.2,.6,.2,1);

  /* ---- レイアウト ---- */
  --rail-w: 296px;
  --gap: var(--sp-4);
  --w-select: 170px;
  --w-search: 220px;

  /* ---- 線図 ---- */
  --chart-pad-l:60; --chart-pad-r:14; --chart-pad-t:12; --chart-pad-b:38;
  --chart-fs:11;
  --chart-ink: var(--n-700);
  --chart-grid: var(--n-200);
  --chart-axis: var(--n-400);
  --chart-line: var(--blue-700);
  --chart-line-2: var(--blue-400);
  --chart-fit: var(--teal-600);
  --chart-offset: var(--amber-600);
  --chart-yield: var(--teal-700);
  --chart-fracture: var(--red-600);
  --chart-band: rgba(42,109,181,.10);
  --chart-halo: var(--n-0);
}

@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0b1524;
    --surface:#131f31;
    --surface-2:#16243a;
    --surface-sunken:#0e1a2b;
    --border:#25364e;
    --border-strong:#33475f;
    --text:#e6edf6;
    --text-muted:#9fb0c6;

    --primary: var(--blue-400);
    --primary-hover: var(--blue-300);
    --primary-active: var(--blue-500);
    --primary-soft:#17304f;
    --primary-soft-2:#132741;
    --primary-text: var(--blue-200);
    --text-on-dark: #06121f;
    --accent: var(--teal-500);
    --accent-soft:#0d3a3a;
    --accent-text:#8fd8d2;
    --focus: var(--blue-300);

    --ok:#4fbf85; --ok-text:#8fdcb2; --ok-bg:#0f3527;
    --warn:#d9a441; --warn-text:#efc97f; --warn-bg:#3a2d0f;
    --err:#e2685f; --err-text:#f2a29b; --err-bg:#3b1714;
    --na:#8496ad; --na-bg:#1b2942;

    --sh-1: 0 1px 2px rgba(0,0,0,.45);
    --sh-2: 0 2px 10px rgba(0,0,0,.5);
    --sh-3: 0 14px 34px rgba(0,0,0,.6);
    --ring: 0 0 0 3px rgba(143,182,222,.4);

    --chart-ink:#c3d2e5;
    --chart-grid:#25364e;
    --chart-axis:#4a5e7a;
    --chart-line: var(--blue-300);
    --chart-line-2: var(--blue-500);
    --chart-fit: var(--teal-500);
    --chart-offset:#d9a441;
    --chart-yield: var(--teal-500);
    --chart-fracture:#e2685f;
    --chart-band: rgba(143,182,222,.12);
    --chart-halo:#131f31;
  }
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur-1:0ms; --dur-2:0ms; }
}

/* ============================================================
   ベース
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; overflow:hidden;                 /* レイアウト方針: ページ自体はスクロールさせない */
  font-family:var(--font); font-size:var(--fs-3); line-height:var(--lh);
  color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p,figure,dl,dd{ margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:none; box-shadow:var(--ring); border-radius:var(--r-1); }
.sr-only{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.muted{ color:var(--text-muted); }
.num{ font-variant-numeric: tabular-nums; }
.mono{ font-family:var(--font-mono); font-size:var(--fs-2); }
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ============================================================
   アプリ枠（100dvh・スクロールレス）
   ============================================================ */
.app{
  height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr);
}

/* ---- アプリバー ---- */
.appbar{
  display:flex; align-items:center; gap:var(--sp-4);
  min-height:var(--h-appbar); padding:var(--sp-2) var(--sp-4);
  background:var(--primary); color:var(--text-on-dark);
  border-bottom:1px solid var(--primary-active);
}
@media (prefers-color-scheme: dark){
  .appbar{ background:var(--surface); color:var(--text); border-bottom-color:var(--border); }
}
.appbar__title{ display:flex; align-items:center; gap:var(--sp-3); min-width:0; }
.mark{
  display:grid; place-items:center; width:34px; height:34px; flex:none;
  border-radius:var(--r-2); background:rgba(255,255,255,.14);
}
@media (prefers-color-scheme: dark){ .mark{ background:var(--primary-soft); } }
.mark svg{ width:22px; height:22px; }
.appbar h1{ font-size:var(--fs-4); font-weight:var(--fw-bold); line-height:var(--lh-tight); letter-spacing:.02em; }
.appbar__sub{ font-size:var(--fs-1); opacity:.78; line-height:var(--lh-tight); margin-top:2px; }
.appbar__actions{ margin-left:auto; display:flex; align-items:center; gap:var(--sp-3); }

/* 主要動作（CTA）は常にここ 1 つ。位置固定・ラベルだけが状態で変わる。 */
.cta-wrap{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; max-width:420px; }
.cta-note{ font-size:var(--fs-1); opacity:.8; text-align:right; line-height:var(--lh-tight); }
@media (prefers-color-scheme: dark){ .cta-note{ color:var(--text-muted); opacity:1; } }

/* ---- ボタン ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--sp-2);
  height:var(--h-ctl); padding:0 var(--sp-3); white-space:nowrap;
  border:1px solid transparent; border-radius:var(--r-2); background:transparent;
  font-size:var(--fs-3); font-weight:var(--fw-med); cursor:pointer;
  transition:background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.btn svg{ width:15px; height:15px; flex:none; }
.btn--primary{
  height:var(--h-ctl-lg); padding:0 var(--sp-5);
  background:var(--n-0); color:var(--primary); font-weight:var(--fw-bold);
  box-shadow:var(--sh-1);
}
.btn--primary:hover:not(:disabled){ background:var(--blue-050); }
.btn--primary:active:not(:disabled){ background:var(--blue-100); }
@media (prefers-color-scheme: dark){
  .btn--primary{ background:var(--primary); color:var(--text-on-dark); }
  .btn--primary:hover:not(:disabled){ background:var(--primary-hover); }
}
.btn--ghost{ border-color:rgba(255,255,255,.34); color:var(--text-on-dark); }
.btn--ghost:hover:not(:disabled){ background:rgba(255,255,255,.14); }
@media (prefers-color-scheme: dark){
  .btn--ghost{ border-color:var(--border-strong); color:var(--text); }
  .btn--ghost:hover:not(:disabled){ background:var(--surface-2); }
}
.btn--plain{ border-color:var(--border-strong); background:var(--surface); color:var(--text); }
.btn--plain:hover:not(:disabled){ background:var(--surface-sunken); }
.btn--accent{ background:var(--accent); color:#fff; }
.btn--accent:hover:not(:disabled){ background:var(--teal-700); }
.btn--icon{ width:var(--h-ctl); padding:0; }
.btn--sm{ height:26px; padding:0 var(--sp-2); font-size:var(--fs-2); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ---- チップ（分割ダウンロードなどの副次操作） ---- */
.chips{ display:flex; flex-wrap:wrap; gap:var(--sp-2); }
.chip{
  display:inline-flex; align-items:center; gap:var(--sp-2);
  height:var(--h-ctl); padding:0 var(--sp-3);
  border:1px solid var(--border-strong); border-radius:var(--r-pill);
  background:var(--surface); color:var(--text); font-size:var(--fs-2); cursor:pointer;
  transition:background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.chip:hover:not(:disabled){ background:var(--primary-soft-2); border-color:var(--primary); }
.chip:disabled{ opacity:.5; cursor:not-allowed; }
.chip svg{ width:14px; height:14px; color:var(--primary); flex:none; }
.chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip__size{ color:var(--text-muted); font-variant-numeric:tabular-nums; flex:none; }
.chips{ min-width:0; }

/* ---- メニュー（危ない操作はここへ退避） ---- */
.menu-wrap{ position:relative; }
.menu{
  position:absolute; right:0; top:calc(100% + var(--sp-2)); z-index:60;
  min-width:260px; padding:var(--sp-2);
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:var(--r-2); box-shadow:var(--sh-3);
}
.menu[hidden]{ display:none; }
.menu button{
  display:flex; width:100%; align-items:center; gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-3); border:0; border-radius:var(--r-1);
  background:transparent; text-align:left; font-size:var(--fs-3); cursor:pointer;
}
.menu button:hover{ background:var(--surface-sunken); }
.menu button:disabled{ opacity:.45; cursor:not-allowed; }
.menu hr{ border:0; border-top:1px solid var(--border); margin:var(--sp-2) 0; }
.menu__danger{ color:var(--err-text); }
.menu__note{ padding:0 var(--sp-3) var(--sp-2); font-size:var(--fs-1); color:var(--text-muted); }

/* ============================================================
   レイアウト本体
   ============================================================ */
.layout{
  display:grid; grid-template-columns:var(--rail-w) minmax(0,1fr);
  gap:var(--gap); padding:var(--gap); min-height:0;
}
.layout[data-empty="true"]{ grid-template-columns:minmax(0,1fr); }
.layout[data-empty="true"] .rail{ display:none; }

/* ---- 左レール（入力・ファイル一覧） ---- */
.rail{
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-3);
  box-shadow:var(--sh-1); overflow:hidden;
}
.rail__head{ padding:var(--sp-3); border-bottom:1px solid var(--border); }
.rail__scroll{ overflow-y:auto; padding:var(--sp-2); display:flex; flex-direction:column; gap:var(--sp-2); }
.rail__foot{
  padding:var(--sp-2) var(--sp-3); border-top:1px solid var(--border);
  background:var(--surface-2); font-size:var(--fs-1); color:var(--text-muted);
}

.fileitem{
  display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px var(--sp-2);
  width:100%; padding:var(--sp-2) var(--sp-3); text-align:left; cursor:pointer;
  border:1px solid var(--border); border-radius:var(--r-2); background:var(--surface);
  transition:background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.fileitem:hover{ background:var(--primary-soft-2); }
.fileitem[aria-selected="true"]{
  border-color:var(--primary); background:var(--primary-soft-2);
  box-shadow:inset 3px 0 0 var(--primary);
}
.fileitem__name{ grid-column:1 / -1; font-weight:var(--fw-med); font-size:var(--fs-3); }
.fileitem__meta{ grid-column:1 / -1; font-size:var(--fs-1); color:var(--text-muted); }
.fileitem__st{ grid-column:1 / -1; }

/* ---- 状態表示（アイコン＋文字＋色の三重表現） ---- */
.status{
  display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
  font-size:var(--fs-1); font-weight:var(--fw-med); line-height:1.4;
  padding:1px var(--sp-2); border-radius:var(--r-pill); border:1px solid transparent;
}
.status svg{ width:12px; height:12px; flex:none; }
.status--ok{ color:var(--ok-text); background:var(--ok-bg); border-color:color-mix(in srgb, var(--ok) 35%, transparent); }
.status--warn{ color:var(--warn-text); background:var(--warn-bg); border-color:color-mix(in srgb, var(--warn) 35%, transparent); }
.status--err{ color:var(--err-text); background:var(--err-bg); border-color:color-mix(in srgb, var(--err) 35%, transparent); }
.status--na{ color:var(--text-muted); background:var(--na-bg); border-color:var(--border); }
.status--busy{ color:var(--primary-text); background:var(--primary-soft); border-color:var(--blue-300); }

/* ---- ドロップゾーン ---- */
.dropzone{
  display:grid; place-items:center; gap:var(--sp-2); text-align:center;
  padding:var(--sp-4); border:2px dashed var(--border-strong); border-radius:var(--r-2);
  background:var(--surface-2); color:var(--text-muted); font-size:var(--fs-2);
  transition:border-color var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
}
.dropzone.is-drag{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary-text); }
.dropzone--hero{
  padding:var(--sp-7) var(--sp-5); gap:var(--sp-4); border-radius:var(--r-3);
  font-size:var(--fs-4); max-width:640px; width:100%;
}
.dropzone--hero svg{ width:52px; height:52px; color:var(--primary); }
.dropzone__title{ font-size:var(--fs-5); font-weight:var(--fw-bold); color:var(--text); }

/* ---- 空状態（初回は「入れる」ことが最重要なので面積を大きく） ---- */
.empty{
  display:grid; place-items:center; align-content:center; gap:var(--sp-5);
  height:100%; padding:var(--sp-5);
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-3); box-shadow:var(--sh-1);
  overflow-y:auto;
}
.empty__points{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--sp-3);
  max-width:900px; width:100%;
}
.empty__point{
  padding:var(--sp-3); border:1px solid var(--border); border-radius:var(--r-2);
  background:var(--surface-2); font-size:var(--fs-2); color:var(--text-muted);
}
.empty__point b{ display:block; color:var(--text); font-size:var(--fs-3); margin-bottom:2px; }

/* ============================================================
   ステージ（右側・単票／一覧）
   ============================================================ */
.stage{ min-width:0; min-height:0; display:grid; }
/* グリッド／フレックスの子は既定で min-width:auto のため、明示的に潰れられるようにする
   （これが無いと表やチップの実寸で列が広がり、ページ全体が横スクロールしてしまう） */
.stage > *, .ws > *, .cols > *, .charts > *, .charts__row > *, .card, .chartcard, .panel > *{ min-width:0; }
.ws{
  display:grid; grid-template-rows:auto auto auto minmax(0,1fr); min-height:0; min-width:0;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-3);
  box-shadow:var(--sh-1); overflow:hidden;
}
.ws__head{
  display:flex; align-items:flex-start; gap:var(--sp-4);
  padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--border); background:var(--surface-2);
}
.ws__id{ min-width:0; flex:1; }
.ws__name{ font-size:var(--fs-5); font-weight:var(--fw-bold); line-height:var(--lh-tight); }
.ws__meta{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); margin-top:var(--sp-1); }
.badge{
  display:inline-flex; align-items:center; gap:4px;
  padding:1px var(--sp-2); border-radius:var(--r-1); border:1px solid var(--border);
  background:var(--surface); font-size:var(--fs-1); color:var(--text-muted);
}
.badge--fmt{ background:var(--primary-soft); border-color:var(--blue-300); color:var(--primary-text); font-weight:var(--fw-bold); }
.badge b{ color:var(--text); font-variant-numeric:tabular-nums; }

/* ---- 表示切替（単票 / 一覧） ---- */
.seg{ display:inline-flex; padding:2px; gap:2px; background:var(--surface-sunken); border-radius:var(--r-2); border:1px solid var(--border); }
.seg button{
  height:26px; padding:0 var(--sp-3); border:0; border-radius:var(--r-1);
  background:transparent; font-size:var(--fs-2); font-weight:var(--fw-med); cursor:pointer; color:var(--text-muted);
}
.seg button[aria-pressed="true"]{ background:var(--surface); color:var(--primary-text); box-shadow:var(--sh-1); }

/* ---- 判定バナー ---- */
.verdict{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-4); border-bottom:1px solid var(--border); font-size:var(--fs-3);
}
.verdict__icon{ display:grid; place-items:center; width:24px; height:24px; border-radius:var(--r-pill); flex:none; }
.verdict__icon svg{ width:15px; height:15px; }
.verdict__label{ font-weight:var(--fw-bold); white-space:nowrap; }
.verdict__why{ color:var(--text-muted); font-size:var(--fs-2); min-width:0; flex:1; }
.verdict--ok{ background:var(--ok-bg); color:var(--ok-text); }
.verdict--ok .verdict__icon{ background:var(--ok); color:#fff; }
.verdict--warn{ background:var(--warn-bg); color:var(--warn-text); }
.verdict--warn .verdict__icon{ background:var(--warn); color:#fff; }
.verdict--ng{ background:var(--err-bg); color:var(--err-text); }
.verdict--ng .verdict__icon{ background:var(--err); color:#fff; }
.verdict--na{ background:var(--na-bg); color:var(--text-muted); }
.verdict--na .verdict__icon{ background:var(--na); color:#fff; }
.verdict--ok .verdict__why,.verdict--warn .verdict__why,.verdict--ng .verdict__why{ color:inherit; opacity:.85; }

/* ---- タブ ---- */
.tabs{
  display:flex; align-items:stretch; gap:var(--sp-1); padding:0 var(--sp-3);
  border-bottom:1px solid var(--border); background:var(--surface); overflow-x:auto;
}
.tab{
  position:relative; height:var(--h-tab); padding:0 var(--sp-3); border:0; background:transparent;
  font-size:var(--fs-3); font-weight:var(--fw-med); color:var(--text-muted); cursor:pointer; white-space:nowrap;
}
.tab:hover:not(:disabled){ color:var(--text); }
.tab[aria-selected="true"]{ color:var(--primary-text); }
.tab[aria-selected="true"]::after{
  content:""; position:absolute; left:var(--sp-2); right:var(--sp-2); bottom:-1px; height:3px;
  background:var(--primary); border-radius:var(--r-1) var(--r-1) 0 0;
}
.tab:disabled{ opacity:.4; cursor:not-allowed; }
.tab .count{ font-variant-numeric:tabular-nums; opacity:.75; }
.tabs__note{
  padding:var(--sp-1) var(--sp-4); font-size:var(--fs-1); color:var(--text-muted);
  background:var(--surface-2); border-bottom:1px solid var(--border);
}

/* ---- パネル（内側だけスクロール） ---- */
.panel{ min-height:0; overflow:auto; padding:var(--sp-4); }
.panel[hidden]{ display:none; }
.panel--fixed{ overflow:hidden; display:grid; }

.cols{ display:grid; gap:var(--gap); align-items:start; }
.cols--2{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); }
.cols--3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
@media (max-width:1180px){ .cols--2,.cols--3{ grid-template-columns:minmax(0,1fr); } }

/* ---- カード ---- */
.card{ border:1px solid var(--border); border-radius:var(--r-2); background:var(--surface); overflow:hidden; }
.card--fill{ display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0; height:100%; }
.card--fill .card__body{ min-height:0; overflow:hidden; }
.card--fill .table-wrap{ height:100%; max-height:100%; }
.card + .card{ margin-top:var(--gap); }
.card__head{
  display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-3); background:var(--surface-2); border-bottom:1px solid var(--border);
}
.card__title{ font-size:var(--fs-3); font-weight:var(--fw-bold); }
.card__title .unit{ font-weight:var(--fw-normal); color:var(--text-muted); }
.card__tools{ margin-left:auto; display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; justify-content:flex-end; min-width:0; }
.card__body{ padding:var(--sp-3); }
.card__body--flush{ padding:0; }
.card__note{
  padding:var(--sp-2) var(--sp-3); border-top:1px solid var(--border);
  background:var(--surface-2); font-size:var(--fs-1); color:var(--text-muted);
}

/* ---- 表 ---- */
.table-wrap{ overflow:auto; max-height:100%; }
table.tbl{ width:100%; border-collapse:collapse; font-size:var(--fs-2); }
.tbl th,.tbl td{ padding:var(--sp-2) var(--sp-3); text-align:left; border-bottom:1px solid var(--border); vertical-align:top; }
.tbl thead th{
  position:sticky; top:0; z-index:2; background:var(--surface-sunken);
  font-size:var(--fs-1); font-weight:var(--fw-bold); color:var(--text-muted);
  white-space:nowrap; border-bottom:1px solid var(--border-strong);
}
.tbl tbody tr:last-child td{ border-bottom:0; }
.tbl tbody tr:hover{ background:var(--primary-soft-2); }
.tbl td.n,.tbl th.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tbl td.k{ color:var(--text-muted); white-space:nowrap; }
.tbl .src{ color:var(--text-muted); font-size:var(--fs-1); }
.tbl .empty-val{ color:var(--text-muted); }
th.sortable{ cursor:pointer; user-select:none; }
th.sortable:hover{ color:var(--text); }
th.sortable .arrow{ opacity:.4; }
th[aria-sort] .arrow{ opacity:1; color:var(--primary); }
tr.rowlink{ cursor:pointer; }

/* ---- 主要値カード ---- */
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:var(--sp-3); }
.stat{
  padding:var(--sp-3); border:1px solid var(--border); border-radius:var(--r-2);
  background:var(--surface-2); min-width:0;
}
.stat--hero{ background:var(--primary-soft-2); border-color:var(--blue-300); }
.stat__label{ font-size:var(--fs-1); color:var(--text-muted); font-weight:var(--fw-med); }
.stat__value{
  display:flex; align-items:baseline; gap:var(--sp-1); margin-top:2px;
  font-size:var(--fs-6); font-weight:var(--fw-bold); font-variant-numeric:tabular-nums; color:var(--primary-text);
  line-height:var(--lh-tight);
}
.stat__value .unit{ font-size:var(--fs-2); font-weight:var(--fw-med); color:var(--text-muted); }
.stat__value.is-na{ font-size:var(--fs-4); color:var(--text-muted); }
.stat__basis{ margin-top:var(--sp-1); font-size:var(--fs-1); color:var(--text-muted); line-height:1.45; }

/* ---- 定義リスト ---- */
.kv{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--sp-1) var(--sp-3); font-size:var(--fs-2); }
.kv dt{ color:var(--text-muted); white-space:nowrap; }
.kv dd{ font-variant-numeric:tabular-nums; word-break:break-all; }

/* ---- 判定チェック ---- */
.checks{ display:flex; flex-direction:column; gap:var(--sp-2); }
.check{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--sp-2); align-items:start; font-size:var(--fs-2); }
.check__body b{ display:block; font-size:var(--fs-3); }

/* ---- フォーム ---- */
.fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:var(--sp-3); }
.field{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.field__label{ font-size:var(--fs-1); color:var(--text-muted); font-weight:var(--fw-med); }
.field__hint{ font-size:var(--fs-1); color:var(--text-muted); }
.input,.select{
  height:var(--h-ctl); padding:0 var(--sp-2); width:100%;
  border:1px solid var(--border-strong); border-radius:var(--r-1);
  background:var(--surface); font-size:var(--fs-3); font-variant-numeric:tabular-nums;
}
.input--search{ width:var(--w-search); }
.select--axis{ width:var(--w-select); }
.input:focus,.select:focus{ border-color:var(--primary); }
.input:disabled,.select:disabled{ background:var(--surface-sunken); color:var(--text-muted); cursor:not-allowed; }
.check-line{ display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-3); }
.check-line input{ width:16px; height:16px; accent-color:var(--primary); }

/* ---- 線図 ---- */
.charts{ display:grid; gap:var(--gap); min-height:0; grid-template-rows:auto minmax(0,1fr); }
.charts__row{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:var(--gap); min-height:0; }
@media (max-width:1180px){ .charts__row{ grid-template-columns:minmax(0,1fr); grid-auto-rows:minmax(240px,1fr); } }
.chartcard{ display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:0; }
/* キャンバスは絶対配置にして「自分の幅がグリッド列幅を押し広げる」ループを断つ */
.chart-host{ position:relative; min-height:0; min-width:0; overflow:hidden; }
.chart-host canvas{ position:absolute; inset:0; display:block; }
.chart__tip{
  position:absolute; z-index:5; pointer-events:none; transform:translate(-50%,-100%);
  padding:var(--sp-1) var(--sp-2); border-radius:var(--r-1);
  background:var(--n-900); color:#fff; font-size:var(--fs-1); white-space:nowrap;
  font-variant-numeric:tabular-nums; box-shadow:var(--sh-2);
}
.legend{ display:flex; flex-wrap:wrap; gap:var(--sp-3); padding:var(--sp-2) var(--sp-3); border-top:1px solid var(--border); background:var(--surface-2); }
.legend-item{ display:inline-flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-1); color:var(--text-muted); }
.legend-item svg{ width:22px; height:12px; flex:none; }
.legend-item b{ color:var(--text); font-weight:var(--fw-med); }

/* ---- 空メッセージ / 理由表示 ---- */
.reason{
  display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--sp-3);
  padding:var(--sp-3); border:1px solid var(--border); border-left:3px solid var(--na);
  border-radius:var(--r-2); background:var(--surface-2); font-size:var(--fs-2); color:var(--text-muted);
}
.reason b{ display:block; color:var(--text); font-size:var(--fs-3); margin-bottom:2px; }
.reason--warn{ border-left-color:var(--warn); }
.reason--err{ border-left-color:var(--err); }
.reason svg{ width:18px; height:18px; color:var(--na); }
.reason--warn svg{ color:var(--warn); }
.reason--err svg{ color:var(--err); }

/* ============================================================
   ドロップ全面オーバーレイ
   ============================================================ */
.dropoverlay{
  position:fixed; inset:0; z-index:80; display:grid; place-items:center;
  background:color-mix(in srgb, var(--primary) 72%, transparent); color:#fff;
  font-size:var(--fs-6); font-weight:var(--fw-bold); letter-spacing:.04em;
}
.dropoverlay[hidden]{ display:none; }
.dropoverlay div{ display:grid; place-items:center; gap:var(--sp-3); padding:var(--sp-6) var(--sp-7);
  border:3px dashed rgba(255,255,255,.7); border-radius:var(--r-3); }
.dropoverlay svg{ width:56px; height:56px; }
.dropoverlay small{ font-size:var(--fs-3); font-weight:var(--fw-normal); opacity:.9; }

/* ============================================================
   トースト（取り消し）
   ============================================================ */
.toast-area{
  position:fixed; left:50%; bottom:var(--sp-5); transform:translateX(-50%);
  z-index:90; display:flex; flex-direction:column; gap:var(--sp-2); align-items:center;
}
.toast{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3); border-radius:var(--r-2);
  background:var(--n-900); color:#fff; font-size:var(--fs-3); box-shadow:var(--sh-3);
  animation:toast-in var(--dur-2) var(--ease);
}
.toast button{
  height:26px; padding:0 var(--sp-3); border:1px solid rgba(255,255,255,.5); border-radius:var(--r-1);
  background:transparent; color:#fff; font-size:var(--fs-2); font-weight:var(--fw-bold); cursor:pointer;
}
.toast button:hover{ background:rgba(255,255,255,.16); }
@keyframes toast-in{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

/* ============================================================
   設定ダイアログ
   ============================================================ */
dialog{
  width:min(860px, 94vw); max-height:88dvh; padding:0; border:0; border-radius:var(--r-3);
  background:var(--surface); color:var(--text); box-shadow:var(--sh-3);
}
dialog::backdrop{ background:rgba(6,26,53,.55); }
.dlg{ display:grid; grid-template-rows:auto minmax(0,1fr) auto; max-height:88dvh; }
.dlg__head{ display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--border); }
.dlg__title{ font-size:var(--fs-5); font-weight:var(--fw-bold); }
.dlg__body{ overflow:auto; padding:var(--sp-4); display:flex; flex-direction:column; gap:var(--gap); }
.dlg__body > *{ flex:none; }   /* スクロール領域内で各カードが潰れないようにする */
.dlg__body .fields{ align-items:end; }
.dlg__foot{ display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-3) var(--sp-4); border-top:1px solid var(--border); background:var(--surface-2); }
.dlg__foot .spacer{ margin-left:auto; }

/* ============================================================
   狭い画面（レールを上部に畳む）
   ============================================================ */
@media (max-width:900px){
  .layout{ grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
  .rail{ grid-template-rows:auto auto; }
  .rail__scroll{ flex-direction:row; overflow-x:auto; overflow-y:hidden; }
  .rail__scroll .fileitem{ min-width:240px; }
  .rail__foot{ display:none; }
  .appbar{ flex-wrap:wrap; }
}
</style>
</head>

<div class="app">

          <path d="M4 17c2.2 0 3.2-8 5-8s2.4 5 4 5 3.2-3 7-9"/>

<script>
"use strict";
/* ============================================================================
 * 引張試験ファイル 変換 ＋ 解析ツール（単一HTML / 完全オフライン）
 *   変換部 : trapezium_html_converter_spec.md §1〜§10（Python 版 v5 の移植）
 *   解析部 : 同 §11〜§17
 *   UI     : 基本設計.md の 7 原則 ＋ スクロールレス方針
 * ==========================================================================*/

/* ───────────────────────── 0. 小道具 ───────────────────────── */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const cssNum = (name) => parseFloat(cssVar(name)) || 0;

function fmtBytes(n) {
  if (n == null) return "—";
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / 1024 / 1024).toFixed(2)} MB`;
}
function fmtNum(v, d = 2) {
  if (v == null || !isFinite(v)) return "—";
  return v.toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d });
}
const SUP = { "-": "⁻", "+": "", "0": "⁰", "1": "¹", "2": "²", "3": "³",
              "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹" };
function fmtExp(v, d = 2) {
  if (v == null || !isFinite(v)) return "—";
  if (v === 0) return "0";
  const [m, e] = v.toExponential(d).split("e");
  return `${m}×10${String(e).split("").map((c) => SUP[c] ?? c).join("")}`;
}
const nowStamp = () => {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* アイコン（状態は必ず「アイコン＋文字＋色」の三重表現にする） */
const ICON = {
  ok:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 6.5"/></svg>',
  warn:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 1.8 20.5h20.4z"/><path d="M12 9.5v5"/><path d="M12 17.6h.01"/></svg>',
  err:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  na:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M6 12h12"/></svg>',

/* ───────────────────────── 1. バイナリ小道具 ───────────────────────── */

/* CRC-32（ZIP 用 ＋ 入力ファイルの照合値表示用） */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const hex8 = (n) => n.toString(16).toUpperCase().padStart(8, "0");

/** バイト列 needle の最初の出現位置（見つからなければ -1） */
function findBytes(hay, needle, from = 0) {
  const n = needle.length, end = hay.length - n;
  if (n === 0) return from;
  const first = needle[0];
  outer: for (let i = from; i <= end; i++) {
    if (hay[i] !== first) continue;
    for (let k = 1; k < n; k++) if (hay[i + k] !== needle[k]) continue outer;
    return i;
  }
  return -1;
}
/** 非重複で全出現位置（Python の re.finditer 相当） */
function findAllBytes(hay, needle) {
  const out = [];
  let i = 0;
  for (;;) {
    const p = findBytes(hay, needle, i);
    if (p < 0) break;
    out.push(p);
    i = p + needle.length;
  }
  return out;
}
const isDigit = (b) => b >= 0x30 && b <= 0x39;

/** バイト列から `\d{4}/\d{2}/\d{2} \d{1,2}:\d{2}:\d{2}` の最初の位置（無ければ -1） */
function findDateTimeOffset(d) {
  const n = d.length;
  for (let i = 0; i + 17 <= n; i++) {
    if (!(isDigit(d[i]) && isDigit(d[i + 1]) && isDigit(d[i + 2]) && isDigit(d[i + 3]))) continue;
    if (d[i + 4] !== 0x2F || !isDigit(d[i + 5]) || !isDigit(d[i + 6])) continue;
    if (d[i + 7] !== 0x2F || !isDigit(d[i + 8]) || !isDigit(d[i + 9])) continue;
    if (d[i + 10] !== 0x20) continue;
    let j = i + 11;
    if (!isDigit(d[j])) continue;
    j++;
    if (isDigit(d[j])) j++;                       // 時は 1〜2 桁
    if (d[j] !== 0x3A || !isDigit(d[j + 1]) || !isDigit(d[j + 2])) continue;
    j += 3;
    if (d[j] !== 0x3A || !isDigit(d[j + 1]) || !isDigit(d[j + 2])) continue;
    return i;
  }
  return -1;
}

/* ───────────────── 2. TLV 文字列トークン抽出（仕様 §4） ───────────────── */

const DEC_U16LE = new TextDecoder("utf-16le", { fatal: true });
const DEC_U8    = new TextDecoder("utf-8",    { fatal: true });

/* §4.1 許可文字クラス（完全一致） */
const CLEAN_RE = /^[　-ヿ一-鿿＀-￯々ー_A-Za-z0-9\/%.^+\-()\[\] :×]+$/;

/**
 * §4.1 xtux 文字列（UTF-16LE, [0x3E][長さ(byte,偶数)][値]）
 * 高速化のため、TextDecoder を呼ぶ前にコードユニットを直接検査する
 * （不正なものはここで落ちるので例外コストが乗らない。判定結果は Python 版と等価）。
 */
function walkXtuxStrings(data, marker = 0x3E) {
  const out = [];
  const n = data.length;
  let i = 0;
  while (i < n - 1) {
    if (data[i] === marker) {
      const L = data[i + 1];
      if (L >= 2 && L <= 254 && (L & 1) === 0 && i + 2 + L <= n) {
        const start = i + 2;
        let ok = true;
        for (let k = 0; k < L; k += 2) {
          const u = data[start + k] | (data[start + k + 1] << 8);
          // 制御文字（\n \r \t 以外）/ 非文字 / サロゲートは不採用
          if (!(u >= 0x20 || u === 0x0A || u === 0x0D || u === 0x09)) { ok = false; break; }
          if (u === 0xFFFE || u === 0xFFFF || (u >= 0xD800 && u <= 0xDFFF)) { ok = false; break; }
        }
        if (ok) {
          let s = null;
          try { s = DEC_U16LE.decode(data.subarray(start, start + L)); } catch (_) { s = null; }
          if (s !== null) {
            // ★ラベルには表示折返し用の改行/タブが埋まっているので、破棄せず除去する
            const s2 = s.replace(/[\n\r\t]/g, "").trim();
            if (s2 && CLEAN_RE.test(s2)) {
              out.push({ off: i, text: s2 });
              i += 2 + L;
              continue;
            }
          }
        }
      }
    }
    i++;
  }
  return out;
}

/**
 * §4.2 vtav 文字列（UTF-8, [1byte長さ][値]）
 * 事前に UTF-8 構造を手検査して、TextDecoder 呼び出しを候補だけに絞る。
 */
function walkVtavStrings(data) {
  const out = [];
  const n = data.length;
  let i = 0;
  while (i < n) {
    const L = data[i];
    if (L >= 1 && L <= 250 && i + 1 + L <= n) {
      const st = i + 1, en = i + 1 + L;
      let p = st, valid = true, hasKey = false;
      while (p < en) {
        const b = data[p];
        let size, cp;
        if (b < 0x80)             { size = 1; cp = b; }
        else if ((b & 0xE0) === 0xC0) { size = 2; cp = b & 0x1F; }
        else if ((b & 0xF0) === 0xE0) { size = 3; cp = b & 0x0F; }
        else if ((b & 0xF8) === 0xF0) { size = 4; cp = b & 0x07; }
        else { valid = false; break; }
        if (p + size > en) { valid = false; break; }
        for (let k = 1; k < size; k++) {
          const c = data[p + k];
          if ((c & 0xC0) !== 0x80) { valid = false; break; }
          cp = (cp << 6) | (c & 0x3F);
        }
        if (!valid) break;
        if ((size === 2 && cp < 0x80) || (size === 3 && cp < 0x800) || (size === 4 && cp < 0x10000)) { valid = false; break; }
        if (cp > 0x10FFFF || (cp >= 0xD800 && cp <= 0xDFFF)) { valid = false; break; }
        if (!(cp >= 0x20 || cp === 0x09)) { valid = false; break; }   // 制御文字（タブ以外）は不採用
        if ((cp >= 0x3000 && cp <= 0x9FFF) || (cp >= 0xFF00 && cp <= 0xFFEF) ||
            (cp >= 0x41 && cp <= 0x5A) || (cp >= 0x61 && cp <= 0x7A) || (cp >= 0x30 && cp <= 0x39)) hasKey = true;
        p += size;
      }
      if (valid && hasKey) {
        let s = null;
        try { s = DEC_U8.decode(data.subarray(st, en)); } catch (_) { s = null; }
        if (s !== null) {
          out.push({ off: i, text: s.trim() });
          i += 1 + L;
          continue;
        }
      }
    }
    i++;
  }
  return out;
}

/* ───────────────── 3. 定数（仕様 §5.0） ───────────────── */

const UNITS = new Set(["N", "N/mm2", "mm", "sec", "%", "MPa/s", "/sec", "mm/min", "GPa", "kN", "MPa"]);
const NUM_RE = /^-?\d+(\.\d+)?$/;
const CJK_RE = /[぀-ヿ一-鿿]/;

const COND_KEYS = ["品名", "試験片名", "厚さ", "幅", "直径", "平行部長さ", "つかみ具間距離",

  "作成日", "試験日", "試験モード", "試験種類", "速度", "試験片形状",
  "バッチ数", "サブバッチ数"];
const COND_KEY_SET = new Set(COND_KEYS);

const NONVALUE = new Set([
  ...COND_KEYS, ...UNITS,
  "タイトル", "キーワード", "オペレータ", "コメント", "結果ファイル名", "条件ファイル名",
  "温度", "湿度", "機体番号", "伸び原点", "名前", "パラメータ", "合否判定", "単位",

  "幅計標点距離", "幅計フルスケール",

/* §5.3 レポート項目マッピング */
const REPORT_FIELDS = [

  ["耐力 Rp0.2",           "N/mm2",  ["耐力点1_応力", "耐力点1Rp"]],

  ["応力増加速度",          "MPa/s",  ["応力増加速度"]],
  ["ひずみ速度",            "/sec",   ["歪速度"]],
  ["クロスヘッド変位速度",   "mm/min", ["実績クロスヘッド変異速度", "クロスヘッド変異速度"]],
  ["弾性率",               "N/mm2",  ["弾性率_Standard"]],
  ["ヤング率",             "GPa",    ["ヤング率"]],
  ["最大試験力 Fm",         "N",      ["最大点_試験力", "最大点_Fm"]],
  ["耐力点試験力",          "N",      ["耐力点1_試験力"]],
];

const MARKER = Uint8Array.from([0x01, 0x00, 0x00, 0x00, 0x00, 0x01, 0x01]);
const CHANNELS = [["Time_sec", -8], ["Stroke_mm", -4], ["Force_N", 29], ["Extensometer_mm", 37]];
const BYTES_試験条件 = Uint8Array.from([0xE8, 0xA9, 0xA6, 0xE9, 0xA8, 0x93, 0xE6, 0x9D, 0xA1, 0xE4, 0xBB, 0xB6]);
const BYTES_TXVFileVersion = Uint8Array.from([...("TXVFileVersion")].map((c) => c.charCodeAt(0)));

/* ───────────────── 4. フォーマット判別（§3） ───────────────── */
function detectFormat(data, filename) {
  const head = data.subarray(0, Math.min(64, data.length));
  if (findBytes(head, BYTES_TXVFileVersion) >= 0) {
    return { fmt: "vtav", basis: 'マジック "TXVFileVersion" を先頭 64 バイト内で検出' };
  }
  const ext = (filename.match(/\.[^.]*$/) || [""])[0].toLowerCase();
  if (ext === ".vtav") return { fmt: "vtav", basis: "拡張子 .vtav による判定（マジック未検出）" };
  return { fmt: "xtux", basis: `拡張子 ${ext || "(なし)"} による判定（マジック未検出）` };
}

/* ───────────────── 5. 結果サマリー（§5.1 xtux：順序構造） ───────────────── */
function parseResultsXtux(tokens) {
  const toks = tokens.map((t) => t.text);
  const res = [];
  let i = 0;
  while (i < toks.length) {
    if (toks[i] === "名前") {
      let j = i;
      while (j < toks.length && toks[j] !== "単位") j++;
      let k = j + 1;
      const rows = [];
      let cur = [];
      while (k < toks.length) {
        const t = toks[k];
        if (NUM_RE.test(t) || t === "名前") break;
        cur.push(t);
        if (UNITS.has(t)) {
          rows.push([cur[0], t, cur.slice(1, -1).join(" ").trim()]);
          cur = [];
        }
        k++;
      }
      const vals = [];
      while (k < toks.length && NUM_RE.test(toks[k])) { vals.push(toks[k]); k++; }
      rows.forEach((r, idx) => res.push({
        label: r[0], unit: r[1], value: idx < vals.length ? vals[idx] : "", param: r[2],
      }));
      i = k;
      continue;
    }
    i++;
  }
  for (const r of res) if (r.label === "" && r.unit === "mm/min") r.label = "実績クロスヘッド変異速度";
  return res;
}

/* ───────────────── 6. 結果サマリー（§5.2 vtav：バイトアンカー） ───────────────── */
function isResultLabel(s) {
  if (!CJK_RE.test(s)) return false;
  if (s === "全エリアで計算" || s.startsWith("計算式") || s.startsWith("速度センサー")) return false;
  if (s.includes("Arial") || s.startsWith("[") || s.startsWith("<<") || s.includes("->") ||
      s.startsWith("(") || s.includes("]") || s.includes("@")) return false;
  return s.includes("_") || s.includes("×") || s.includes("点") || s.endsWith("率") ||
         s.includes("速度") || s.includes("ヤング");
}
function nearestUnit(unitsSorted, voff) {
  let unit = "";
  for (const u of unitsSorted) {
    if (u.off >= voff) break;
    if (voff - u.off < 200) unit = u.text;
  }
  return unit;
}
/**
 * 値アンカー ([\x01-\x0f])(-?[0-9][0-9.\-]{0,14})\x00[\x01\x02]\x00\x00\x00 を
 * バイト列上で直接走査する（group1 の長さ整合チェック込み ＝ Python 版と等価）。
 */
function scanVtavAnchors(d) {
  const hits = [];
  const n = d.length;
  for (let i = 0; i + 6 < n; i++) {
    const L = d[i];
    if (L < 0x01 || L > 0x0F) continue;
    const end = i + 1 + L;
    if (end + 5 > n) continue;
    // 末尾 \x00 [\x01|\x02] \x00 \x00 \x00
    if (d[end] !== 0x00 || (d[end + 1] !== 0x01 && d[end + 1] !== 0x02) ||
        d[end + 2] !== 0x00 || d[end + 3] !== 0x00 || d[end + 4] !== 0x00) continue;
    // 値本体 -?[0-9][0-9.\-]{0,14}
    let p = i + 1;
    if (d[p] === 0x2D) p++;                                  // 先頭の '-'
    if (p >= end || !isDigit(d[p])) continue;                // 続く 1 文字は数字
    p++;
    let ok = true;
    for (; p < end; p++) {
      const b = d[p];
      if (!(isDigit(b) || b === 0x2E || b === 0x2D)) { ok = false; break; }
    }
    if (!ok) continue;
    let s = "";
    for (let q = i + 1; q < end; q++) s += String.fromCharCode(d[q]);
    hits.push({ off: i, val: s, na: false });
  }
  // 未算出 (N/A) アンカー \x03 "-.-" \x00 [\x01\x02] \x00\x00\x00
  for (let i = 0; i + 8 < n; i++) {
    if (d[i] !== 0x03 || d[i + 1] !== 0x2D || d[i + 2] !== 0x2E || d[i + 3] !== 0x2D) continue;
    if (d[i + 4] !== 0x00 || (d[i + 5] !== 0x01 && d[i + 5] !== 0x02) ||
        d[i + 6] !== 0x00 || d[i + 7] !== 0x00 || d[i + 8] !== 0x00) continue;
    hits.push({ off: i, val: "N/A", na: true });
  }
  hits.sort((a, b) => a.off - b.off);
  return hits;
}
function parseResultsVtav(data, tokens) {
  let auditStart = findBytes(data, BYTES_試験条件);
  if (auditStart < 0) auditStart = data.length;
  const dt = findDateTimeOffset(data);
  const resultsStart = dt >= 0 ? dt : 0;

  const labels = tokens.filter((t) => isResultLabel(t.text));
  const units  = tokens.filter((t) => UNITS.has(t.text));

  const res = [];
  const seen = new Set();
  let li = 0;                                   // labels は offset 昇順なのでポインタで追える
  for (const h of scanVtavAnchors(data)) {
    if (!(resultsStart <= h.off && h.off < auditStart)) continue;
    if (h.val === "0") continue;
    // 値アンカーより前で最も近いラベル（200 バイト以内）を採る。使い回しはしない。
    while (li < labels.length && labels[li].off < h.off) li++;
    const pick = li > 0 && h.off - labels[li - 1].off < 200 ? labels[li - 1] : null;
    if (!pick) continue;
    if (seen.has(pick.off)) continue;
    seen.add(pick.off);
    res.push({ label: pick.text, unit: nearestUnit(units, h.off), value: h.val, param: "" });
  }
  return res;
}

/* ───────────────── 7. 試験条件（§5.4） ───────────────── */
const DATE_RE = /^\d{4}\/\d{2}\/\d{2}( \d{1,2}:\d{2}:\d{2})?$/;
const DIM_RE = /^-?\d+\.\d+$/;
const LOADCELL_RE = /^\d+\s?kN$/;
const LOT_RE = /^[A-Z][0-9A-Z]{6,}$/;
const DIM_KEYS = new Set(["厚さ", "幅", "直径", "平行部長さ", "つかみ具間距離"]);

function validateCond(key, cand) {
  if (DIM_KEYS.has(key)) return DIM_RE.test(cand) ? cand : null;
  if (key === "作成日" || key === "試験日") return DATE_RE.test(cand) ? cand : null;
  if (key === "ロードセル容量") return LOADCELL_RE.test(cand) ? cand : null;
  if (key === "バッチ数" || key === "サブバッチ数") return /^\d+$/.test(cand) ? cand : null;
  return NONVALUE.has(cand) ? null : cand;
}
function extractConditions(tokens) {
  const vals = tokens.map((t) => t.text);
  const cond = {};
  for (let idx = 0; idx < vals.length; idx++) {
    const s = vals[idx];
    if (!COND_KEY_SET.has(s) || s in cond) continue;
    for (let j = idx + 1; j < Math.min(idx + 6, vals.length); j++) {
      const cand = vals[j];
      if (!cand || cand === s) continue;
      if (COND_KEY_SET.has(cand)) break;
      const ok = validateCond(s, cand);
      if (ok !== null) { cond[s] = ok; break; }
    }
  }
  for (const t of tokens) {
    if (LOT_RE.test(t.text)) { cond["ロット/製造番号"] = t.text; break; }
  }
  return cond;
}
/** §5.4.2 xtux の寸法補完（UTF-8 TLV 側の寸法セクションから拾う） */
function supplementXtuxDims(cond, u8tokens) {
  const vals = u8tokens.map((t) => t.text);
  const stop = new Set(["試験片名", "名前", "パラメータ", "合否判定", "単位"]);
  const filled = [];
  for (let idx = 0; idx < vals.length; idx++) {
    const s = vals[idx];
    if (!DIM_KEYS.has(s) || s in cond) continue;
    for (let j = idx + 1; j < Math.min(idx + 6, vals.length); j++) {
      const c = vals[j];
      if (DIM_KEYS.has(c) || stop.has(c)) break;
      if (DIM_RE.test(c)) { cond[s] = c; filled.push(s); break; }   // 小数のみ（フラグ "1" を除外）
    }
  }
  return filled;
}

/* ───────────────── 8. 生波形（§5.5） ───────────────── */
function extractWaveform(data) {
  const pos = findAllBytes(data, MARKER);
  if (pos.length < 20) {
    return { ok: false, reason: `波形マーカー（01 00 00 00 00 01 01）の検出数が ${pos.length} 個（20 個未満）`, points: 0 };
  }
  const counts = new Map();
  for (let i = 0; i < pos.length - 1; i++) {
    const d = pos[i + 1] - pos[i];
    if (d > 0 && d < 4096) counts.set(d, (counts.get(d) || 0) + 1);
  }
  if (!counts.size) return { ok: false, reason: "マーカー間隔が全て 4096 バイト以上で、レコード周期を決められない", points: 0 };
  let stride = 0, best = -1;
  for (const [d, c] of counts) if (c > best) { best = c; stride = d; }   // 同数なら先に現れた方（Counter 相当）

  const good = [];
  for (let i = 0; i < pos.length - 1; i++) if (pos[i + 1] - pos[i] === stride) good.push(pos[i]);
  if (good.length && pos[pos.length - 1] - good[good.length - 1] === stride) good.push(pos[pos.length - 1]);
  if (good.length < 20) {
    return { ok: false, reason: `レコード周期 ${stride} バイトに一致する点が ${good.length} 個（20 個未満）`, points: 0, stride };
  }

  const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const columns = {};
  const dropped = [];
  for (const [name, off] of CHANNELS) {
    const arr = new Float64Array(good.length);
    let ok = true;
    for (let i = 0; i < good.length; i++) {
      const p = good[i] + off;
      if (p < 0 || p + 4 > data.length) { ok = false; break; }
      const v = dv.getFloat32(p, true);
      if (Number.isNaN(v)) { ok = false; break; }               // NaN を含む列は採用しない
      arr[i] = v;
    }
    if (ok) columns[name] = arr; else dropped.push(name);
  }
  return { ok: Object.keys(columns).length > 0, stride, points: good.length, columns, dropped,
           reason: Object.keys(columns).length ? "" : "全チャネルが範囲外または NaN を含み、採用できる列がない" };
}

/* ───────────────── 9. 変更履歴（§5.6, vtav のみ） ───────────────── */
function parseAudit(tokens) {
  const vals = tokens.map((t) => t.text);
  const dtRe = /^\d{4}\/\d{2}\/\d{2} \d{1,2}:\d{2}:\d{2}$/;
  const rows = [];
  for (let i = 0; i < vals.length; i++) {
    const s = vals[i];
    if (!(s.includes("試験条件") && s.startsWith("<<"))) continue;
    let change = i + 1 < vals.length ? vals[i + 1] : "";
    let when = "", user = "";
    for (let j = i + 1; j < Math.min(i + 4, vals.length); j++) {
      if (dtRe.test(vals[j])) {
        when = vals[j];
        user = j + 1 < vals.length ? vals[j + 1] : "";
        if (j === i + 1) change = "";
        break;
      }
    }
    rows.push({ item: s, change, datetime: when, user });
  }
  return rows;
}

/* ───────────────── 10. レポート項目（§5.3） ───────────────── */
function buildReport(results) {
  const byLabel = new Map();
  for (const r of results) if (!byLabel.has(r.label)) byLabel.set(r.label, r);   // 先勝ち
  return REPORT_FIELDS.map(([item, unit, cands]) => {
    for (const c of cands) {
      if (byLabel.has(c)) return { item, value: byLabel.get(c).value, unit, source_label: c };
    }
    return { item, value: "", unit, source_label: "" };
  });
}

/* ───────────────── 11. CSV 出力（§6） ───────────────── */
const BOM = Uint8Array.from([0xEF, 0xBB, 0xBF]);
function csvField(v) {
  const s = v == null ? "" : String(v);
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function toCsv(rows) {
  return rows.map((r) => r.map(csvField).join(",")).join("\r\n") + "\r\n";
}
/** UTF-8 BOM 付きバイト列にする（Excel で文字化けしないこと） */
function csvBytes(text) {
  const body = new TextEncoder().encode(text);
  const out = new Uint8Array(BOM.length + body.length);
  out.set(BOM, 0);
  out.set(body, BOM.length);
  return out;
}
/**
 * 波形の小数 6 桁丸め。Python の round(x, 6) と同じ「偶数丸め」にそろえる
 * （float32 由来の値では x*1e6 が誤差なく求まるため、これで Python 版と完全一致する）。
 */
function round6HalfEven(v) {
  if (!isFinite(v)) return v;
  const s = v * 1e6;
  const f = Math.floor(s);
  const d = s - f;
  const n = d > 0.5 ? f + 1 : d < 0.5 ? f : (f % 2 === 0 ? f : f + 1);
  return n / 1e6;
}
/** Python の str(float) と同じ見た目にする（整数値でも小数点を残す） */
function pyFloat(v) {
  const r = round6HalfEven(v);
  if (Object.is(r, -0)) return "-0.0";
  return Number.isInteger(r) ? r.toFixed(1) : String(r);
}
function downloadBytes(bytes, filename, mime) {
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ───────────────── 12. Zip（§7.2 / store・内蔵実装） ───────────────── */
function dosStamp(d) {
  return {
    time: ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31),
    date: (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31),
  };
}
function zipStore(files) {
  const enc = new TextEncoder();
  const { time, date } = dosStamp(new Date());
  const parts = [];
  const central = [];
  let offset = 0;

  for (const f of files) {
    const name = enc.encode(f.path);
    const crc = crc32(f.data);
    const lh = new Uint8Array(30 + name.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034B50, true);
    dv.setUint16(4, 20, true);         // version needed
    dv.setUint16(6, 0x0800, true);     // 汎用フラグ bit11 = ファイル名は UTF-8
    dv.setUint16(8, 0, true);          // method = 0 (store)
    dv.setUint16(10, time, true);
    dv.setUint16(12, date, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, f.data.length, true);
    dv.setUint32(22, f.data.length, true);
    dv.setUint16(26, name.length, true);
    dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, f.data);
    central.push({ name, crc, size: f.data.length, offset });
    offset += lh.length + f.data.length;
  }

  const cdParts = [];
  let cdSize = 0;
  for (const c of central) {
    const ch = new Uint8Array(46 + c.name.length);
    const dv = new DataView(ch.buffer);
    dv.setUint32(0, 0x02014B50, true);
    dv.setUint16(4, 20, true);         // version made by
    dv.setUint16(6, 20, true);         // version needed
    dv.setUint16(8, 0x0800, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, time, true);
    dv.setUint16(14, date, true);
    dv.setUint32(16, c.crc, true);
    dv.setUint32(20, c.size, true);
    dv.setUint32(24, c.size, true);
    dv.setUint16(28, c.name.length, true);
    dv.setUint16(30, 0, true);         // extra
    dv.setUint16(32, 0, true);         // comment
    dv.setUint16(34, 0, true);         // disk
    dv.setUint16(36, 0, true);         // internal attrs
    dv.setUint32(38, 0, true);         // external attrs
    dv.setUint32(42, c.offset, true);
    ch.set(c.name, 46);
    cdParts.push(ch);
    cdSize += ch.length;
  }
  const eocd = new Uint8Array(22);
  const edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054B50, true);
  edv.setUint16(8, central.length, true);
  edv.setUint16(10, central.length, true);
  edv.setUint32(12, cdSize, true);
  edv.setUint32(16, offset, true);

  const total = offset + cdSize + eocd.length;
  const out = new Uint8Array(total);
  let p = 0;
  for (const b of parts)   { out.set(b, p); p += b.length; }
  for (const b of cdParts) { out.set(b, p); p += b.length; }
  out.set(eocd, p);
  return out;
}
/* ───────────────── 13. 解析パラメータ既定値（§15） ───────────────── */

/* ───────────────── 14. 数値ユーティリティ ───────────────── */
const fin = (v) => typeof v === "number" && isFinite(v);
function median(arr) {
  const a = arr.filter(fin).sort((x, y) => x - y);
  if (!a.length) return NaN;
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
/** 最小二乗フィット（idxs で指定した点のみ） */
function lsqFit(xs, ys, idxs) {
  let n = 0, sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0;
  for (const i of idxs) {
    const x = xs[i], y = ys[i];
    if (!fin(x) || !fin(y)) continue;
    n++; sx += x; sy += y; sxx += x * x; sxy += x * y; syy += y * y;
  }
  if (n < 2) return null;
  const d = n * sxx - sx * sx;
  if (Math.abs(d) < 1e-12) return null;
  const slope = (n * sxy - sx * sy) / d;
  const intercept = (sy - slope * sx) / n;
  const num = n * sxy - sx * sy;
  const den = Math.sqrt((n * sxx - sx * sx) * (n * syy - sy * sy));
  const r2 = den > 0 ? (num / den) ** 2 : NaN;
  return { slope, intercept, r2, n };
}
function movingAverage(src, win) {
  const n = src.length;
  if (!(win > 1) || n === 0) return src;
  const half = Math.floor(win / 2);
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0, c = 0;
    for (let k = i - half; k <= i + half; k++) {
      if (k < 0 || k >= n) continue;
      const v = src[k];
      if (!fin(v)) continue;
      s += v; c++;
    }
    out[i] = c ? s / c : NaN;
  }
  return out;
}

/* ───────────────── 15. 解析エンジン（§12〜§14） ───────────────── */
/**
 * @param inp {time,force,stress,displacement,stroke: Float64Array|null, area, areaBasis, stressSource}
 * @param P   解析パラメータ
 */
function analyze(inp, P) {
  const force = inp.force;
  const n = force ? force.length : 0;
  const A = {
    ok: false, n, blocked: [], series: {}, basis: {},
  };
  if (!force || n < 5) {
    A.reason = "試験力の点数が 5 点未満のため、解析できません";
    return A;
  }

  /* --- 12.1 ひずみ ε [%] --- */
  let strain = null;
  if (inp.displacement) {
    strain = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const d = inp.displacement[i];
      strain[i] = fin(d) ? (d / P.gaugeLength) * 100 : NaN;
    }
    A.basis.strain = `ε = 変位計 ÷ ゲージ長 ${fmtNum(P.gaugeLength, 1)} mm × 100`;
  } else {
    A.blocked.push({ what: "ひずみ ε", why: "変位（伸び計）データが無いため算出できません" });
  }

  /* --- 応力 σ（§11.2：入力経路で取得方法が変わる） --- */
  let stress = null;
  if (inp.stress) {
    stress = inp.stress;
    A.basis.stress = inp.stressSource || "入力の応力列をそのまま使用（換算なし）";
  } else if (fin(inp.area) && inp.area > 0) {
    stress = new Float64Array(n);
    for (let i = 0; i < n; i++) stress[i] = fin(force[i]) ? force[i] / inp.area : NaN;
    A.basis.stress = `σ = 試験力 ÷ 断面積 A（A = ${fmtNum(inp.area, 3)} mm²）／${inp.areaBasis || "断面積は手入力"}`;
  } else {
    A.blocked.push({ what: "応力 σ", why: "断面積 A が未確定です（試験条件に寸法が無いため、解析タブで A または 厚さ・幅・直径 を入力してください）" });
  }

  /* --- 12.2 速度 v [mm/min] --- */
  let velocity = null;
  if (inp.time && inp.stroke) {
    const raw = new Float64Array(n);
    raw.fill(NaN);
    for (let i = 1; i < n; i++) {
      const dt = inp.time[i] - inp.time[i - 1];
      if (!(dt > 0) || !fin(inp.stroke[i]) || !fin(inp.stroke[i - 1])) continue;
      raw[i] = ((inp.stroke[i] - inp.stroke[i - 1]) / dt) * 60;
    }
    if (n > 1) raw[0] = raw[1];
    velocity = P.smoothing ? movingAverage(raw, P.smoothingWindow) : raw;
    A.basis.velocity = `v = Δストローク ÷ Δ時間 × 60` +
      (P.smoothing ? `／移動平均 ${P.smoothingWindow} 点で平滑化` : "／平滑化なし");
  } else {
    A.blocked.push({
      what: "速度 v",
      why: `${!inp.time ? "時間" : "ストローク"}データが無いため算出できません`,
    });
  }

  A.series = { time: inp.time, force, stroke: inp.stroke, displacement: inp.displacement, strain, stress, velocity };

  /* --- 14.1 引張強さ Rm（最大試験力に対応する応力） --- */
  let maxIndex = 0, maxForce = -Infinity;
  for (let i = 0; i < n; i++) if (fin(force[i]) && force[i] > maxForce) { maxForce = force[i]; maxIndex = i; }
  A.max = { index: maxIndex, force: maxForce };
  if (stress) {
    A.rm = {
      value: stress[maxIndex], index: maxIndex, force: maxForce,
      strain: strain ? strain[maxIndex] : NaN,
      basis: `最大試験力 ${fmtNum(maxForce, 1)} N（第 ${maxIndex + 1} 点）に対応する応力`,
    };
  } else {
    A.rm = null;
  }

  /* --- 14.2 耐力①: 速度法（降伏点検出） --- */
  if (velocity && fin(maxForce)) {
    const band = [];
    for (let i = 0; i < n; i++) {
      if (!fin(force[i]) || !fin(velocity[i])) continue;
      if (force[i] >= 0.05 * maxForce && force[i] <= 0.30 * maxForce) band.push(velocity[i]);
    }
    const vBase = median(band);
    let thr = P.velocityThreshold, thrWhy = `設定値 ${fmtNum(P.velocityThreshold, 1)} mm/min`;
    if (vBase >= 2.7 && vBase <= 3.3) { thr = 3.3; thrWhy = `弾性域の基準速度 ${fmtNum(vBase, 2)} mm/min → 試験速度 3 mm/min と判定`; }
    else if (vBase >= 5.4 && vBase <= 6.6) { thr = 6.6; thrWhy = `弾性域の基準速度 ${fmtNum(vBase, 2)} mm/min → 試験速度 6 mm/min と判定`; }
    const forceFloor = maxForce * (P.linearStart_pct / 100);
    let idx = -1;
    for (let i = 0; i < n; i++) {
      if (!fin(force[i]) || !fin(velocity[i])) continue;
      if (force[i] >= forceFloor && velocity[i] > thr) { idx = i; break; }
    }
    if (idx >= 0) {
      A.yieldV = {
        index: idx, force: force[idx], velocity: velocity[idx], threshold: thr, vBase,
        strain: strain ? strain[idx] : NaN,
        stress: stress ? stress[idx] : NaN,
        basis: `速度が閾値 ${fmtNum(thr, 2)} mm/min を最初に超えた第 ${idx + 1} 点（${thrWhy}／下限荷重 ${fmtNum(forceFloor, 0)} N ＝ Fmax の ${fmtNum(P.linearStart_pct, 0)}%）`,
      };
    } else {
      A.yieldV = null;
      A.blocked.push({ what: "耐力（速度法）", why: `速度が閾値 ${fmtNum(thr, 2)} mm/min を超える点が見つかりません（基準速度 ${fin(vBase) ? fmtNum(vBase, 2) + " mm/min" : "算出不可"}）` });
    }
  } else {
    A.yieldV = null;
    A.blocked.push({ what: "耐力（速度法）", why: "速度（時間・ストローク）が無いため検出できません" });
  }

  /* --- 14.3 前提: 弾性直線域と勾配 slope --- */
  A.linear = null;
  if (stress && strain) {
    let base, baseWhy;
    if (A.yieldV && fin(A.yieldV.stress)) {
      base = A.yieldV.stress;
      baseWhy = `耐力（速度法）の応力 ${fmtNum(base, 1)} N/mm² を基準`;
    } else if (A.rm && fin(A.rm.value)) {
      base = A.rm.value * 0.8;
      baseWhy = `耐力（速度法）が無いため 引張強さ Rm × 0.8 = ${fmtNum(base, 1)} N/mm² を代替基準に使用`;
    } else {
      base = NaN; baseWhy = "";
    }
    if (fin(base)) {
      const lo = base * P.linearityLo, hi = base * P.linearityHi;
      const cand = [];
      const limit = A.yieldV ? A.yieldV.index : maxIndex;
      for (let i = 0; i <= limit && i < n; i++) {
        if (!fin(strain[i]) || !fin(stress[i])) continue;
        if (stress[i] >= lo && stress[i] <= hi) cand.push(i);
      }
      if (cand.length >= 5) {
        // 降伏開始側（高応力側）の非直線点を、R² が合格域に入るまで切り落として cutoff を決める
        let use = cand.slice();
        let fit = lsqFit(strain, stress, use);
        const minKeep = Math.max(5, Math.floor(cand.length * 0.5));
        let trimmed = 0;
        while (fit && fit.r2 < P.linearityR2Ok && use.length > minKeep) {
          use = use.slice(0, use.length - 1);
          trimmed++;
          fit = lsqFit(strain, stress, use);
        }
        if (fit) {
          const s0 = use[0], s1 = use[use.length - 1];
          A.linear = {
            startIdx: s0, cutoffIdx: s1, slope: fit.slope, intercept: fit.intercept, r2: fit.r2,
            nPoints: fit.n, trimmed,
            strainFrom: strain[s0], strainTo: strain[s1],
            basis: `${baseWhy}／応力バンド ${fmtNum(lo, 1)}〜${fmtNum(hi, 1)} N/mm²（× ${P.linearityLo}〜${P.linearityHi}）内の ${fit.n} 点で最小二乗フィット` +
                   (trimmed ? `／非直線の ${trimmed} 点を高応力側から除外` : ""),
            fallback: !(A.yieldV && fin(A.yieldV.stress)),
          };
          A.youngs = { nmm2: fit.slope * 100, gpa: (fit.slope * 100) / 1000 };
        }
      } else {
        A.blocked.push({ what: "弾性勾配・0.2%耐力", why: `直線域バンド内の点が ${cand.length} 点しかありません（5 点以上必要）` });
      }
    } else {
      A.blocked.push({ what: "弾性勾配・0.2%耐力", why: "基準となる耐力応力・引張強さのいずれも算出できません" });
    }
  } else if (!A.blocked.some((b) => b.what === "応力 σ" || b.what === "ひずみ ε")) {
    A.blocked.push({ what: "弾性勾配・0.2%耐力", why: "ひずみ・応力が揃っていません" });
  }

  /* --- 14.3 0.2% オフセット耐力 --- */
  A.offset02 = null;
  if (A.linear && strain && stress) {
    const { slope } = A.linear;
    const line = (e) => slope * (e - 0.2);
    let found = null, bestAbs = Infinity, bestIdx = -1;
    let prevIdx = -1;
    for (let i = 0; i <= maxIndex; i++) {
      if (!fin(strain[i]) || !fin(stress[i])) continue;
      if (strain[i] <= 0.2) { prevIdx = i; continue; }
      const diff = stress[i] - line(strain[i]);
      if (Math.abs(diff) < bestAbs) { bestAbs = Math.abs(diff); bestIdx = i; }
      if (prevIdx >= 0) {
        const dPrev = stress[prevIdx] - line(strain[prevIdx]);
        if (dPrev > 0 && diff <= 0) {                      // 正 → 0 以下 に変わった点が交点
          const pick = Math.abs(dPrev) <= Math.abs(diff) ? prevIdx : i;
          found = { index: pick, strain: strain[pick], stress: stress[pick], approx: false };
          break;
        }
      }
      prevIdx = i;
    }
    if (!found && bestIdx >= 0) {
      found = { index: bestIdx, strain: strain[bestIdx], stress: stress[bestIdx], approx: true };
    }
    if (found) {
      found.basis = `オフセット線 σ = ${fmtNum(A.linear.slope, 1)} × (ε − 0.2) との` +
        (found.approx ? "差が最小の点（交差が見つからないため近似採用）" : `交点（第 ${found.index + 1} 点）`);
      A.offset02 = found;
    }
  }

  /* --- 14.4 伸び（破断ひずみ）方式A: 式①→② --- */
  A.fractureA = null;
  {
    const k1 = P.fracture_k1, k2 = P.fracture_k2;
    let dropStart = -1;
    for (let i = maxIndex + 1; i < n - 1; i++) {
      const d1 = Math.abs(force[i] - force[i - 1]);
      const d2 = Math.abs(force[i + 1] - force[i]);
      if (d1 > maxForce * 0.0005 && d2 > k1 * d1) { dropStart = i; break; }
    }
    const searchStart = dropStart >= 0 ? dropStart : maxIndex;
    let fr = -1;
    for (let i = searchStart; i < n - 1; i++) {
      if (force[i + 1] < k2 * maxForce) { fr = i; break; }
    }
    if (fr >= 0) {
      A.fractureA = {
        index: fr, strain: strain ? strain[fr] : NaN, stress: stress ? stress[fr] : NaN,
        dropStart,
        basis: `式①（急落開始）${dropStart >= 0 ? `第 ${dropStart + 1} 点` : "検出なし → 最大点から探索"}` +
               `／式②（試験力が Fmax の ${fmtNum(k2 * 100, 1)}% 未満）第 ${fr + 1} 点`,
      };
    } else {
      A.blocked.push({ what: "伸び（式①→②法）", why: `試験力が Fmax の ${fmtNum(k2 * 100, 1)}% 未満に下がる点がありません（破断まで記録されていない可能性）` });
    }
  }

  /* --- 14.4 方式B: 島津法（1 秒間の荷重低下率） --- */
  A.fractureB = null;
  if (inp.time) {
    const dts = [];
    for (let i = 1; i < n; i++) {
      const d = inp.time[i] - inp.time[i - 1];

    }

    const threshold = maxForce * (P.shimadzuPctOfMaxForce / 100);

    for (let i = maxIndex; i + steps < n; i++) {

    }
    if (fr >= 0) {

        index: fr, strain: strain ? strain[fr] : NaN, stress: stress ? stress[fr] : NaN,

        basis: `サンプリング周期 ${fmtNum(dt, 4)} s（${steps} 点＝1 秒）で試験力が ${fmtNum(threshold, 0)} N（Fmax の ${fmtNum(P.shimadzuPctOfMaxForce, 0)}%）以上低下した第 ${fr + 1} 点`,
      };
    } else {
      A.blocked.push({ what: "伸び（島津法）", why: `1 秒間に Fmax の ${fmtNum(P.shimadzuPctOfMaxForce, 0)}% 以上低下する区間がありません` });
    }
  } else {
    A.blocked.push({ what: "伸び（島津法）", why: "時間データが無いため 1 秒間の低下率を評価できません" });

    };

  }

  A.rampRate = null;

    const idxs = [];
    for (let i = A.linear.startIdx; i <= A.linear.cutoffIdx; i++) idxs.push(i);

        value: fit.slope, r2: fit.r2, nPoints: fit.n,
        basis: `直線域（第 ${A.linear.startIdx + 1}〜${A.linear.cutoffIdx + 1} 点・${fit.n} 点）の 時間 vs 応力 最小二乗傾き`,

    }
  } else if (!inp.time) {
    A.blocked.push({ what: "応力増加速度", why: "時間データが無いため算出できません" });
  }

  A.strainRate2 = null;

    if (A.linear) {
      const idxs = [];
      for (let i = A.linear.startIdx; i <= A.linear.cutoffIdx; i++) idxs.push(i);
      const f = lsqFit(inp.time, strain, idxs);
      if (f) A.strainRate1 = { value: f.slope / 100, nPoints: f.n, basis: `直線域 ${f.n} 点の 時間 vs ひずみ(%) 傾き ÷ 100` };
    }

      if (f) A.strainRate2 = { value: f.slope / 100, nPoints: f.n, basis: `耐力点〜破断点 ${f.n} 点の 時間 vs ひずみ(%) 傾き ÷ 100` };

  /* --- 判定（§16.1）：色だけでなく必ず理由を文字で持たせる --- */
  const checks = [];

    const r2 = A.linear.r2;
    const lv = r2 >= P.linearityR2Ok ? "ok" : (r2 >= P.linearityR2Warn ? "warn" : "ng");
    checks.push({
      level: lv, label: "弾性直線域の直線性",
      detail: `R² = ${r2.toFixed(5)}（合格 ≥ ${P.linearityR2Ok} / 要確認 ≥ ${P.linearityR2Warn}）・${A.linear.nPoints} 点`,
    });
  } else {
    checks.push({ level: "na", label: "弾性直線域の直線性", detail: "直線域を決定できないため未評価" });
  }

    if (A.rampRate) {
      const v = A.rampRate.value;
      const inRange = v >= P.rampMin && v <= P.rampMax;
      checks.push({
        level: inRange ? "ok" : "ng", label: "応力増加速度",
        detail: `${fmtNum(v, 2)} MPa/s（許容範囲 ${fmtNum(P.rampMin, 1)}〜${fmtNum(P.rampMax, 1)} MPa/s・設定値）`,

  }

  if (!A.rm) missing.push("引張強さ Rm");
  if (!A.yieldV) missing.push("耐力（速度法）");
  if (!A.offset02) missing.push("0.2% 耐力");
  if (!A.elongation) missing.push("伸び");
  checks.push({
    level: missing.length === 0 ? "ok" : (missing.length >= 3 ? "ng" : "warn"),
    label: "主要値の算出",
    detail: missing.length === 0 ? "引張強さ・耐力・0.2%耐力・伸びをすべて算出" : `未算出: ${missing.join(" / ")}`,
  });
  const rank = { ok: 0, warn: 1, ng: 2, na: 1 };
  let worst = "ok";
  for (const c of checks) if (rank[c.level] > rank[worst]) worst = c.level === "na" ? "warn" : c.level;
  A.verdict = {
    level: A.ok ? worst : "na",
    label: !A.ok ? "解析なし" : worst === "ok" ? "合格" : worst === "warn" ? "要確認" : "不合格",
    checks,
  };
  return A;
}

/* ───────────────── 16. 解析結果の行データ（画面・CSV 共用） ───────────────── */
function analysisRows(A) {
  if (!A) return [];
  const rows = [];
  const add = (item, value, unit, basis) => rows.push({ item, value, unit, basis });
  add("引張強さ Rm", A.rm ? fmtNum(A.rm.value, 1) : "", "N/mm2", A.rm ? A.rm.basis : "算出不可");
  add("最大試験力 Fm", fin(A.max?.force) ? fmtNum(A.max.force, 1) : "", "N", A.max ? `第 ${A.max.index + 1} 点` : "");
  add("耐力（速度法）", A.yieldV && fin(A.yieldV.stress) ? fmtNum(A.yieldV.stress, 1) : "", "N/mm2", A.yieldV ? A.yieldV.basis : "算出不可");
  add("0.2% 耐力", A.offset02 ? fmtNum(A.offset02.stress, 1) : "", "N/mm2", A.offset02 ? A.offset02.basis : "算出不可");
  add("伸び（破断ひずみ）", A.elongation ? fmtNum(A.elongation.value, 2) : "", "%", A.elongation ? `${A.elongation.method}／${A.elongation.basis}` : "算出不可");
  add("伸び（島津法）", A.fractureB && fin(A.fractureB.strain) ? fmtNum(A.fractureB.strain, 2) : "", "%", A.fractureB ? A.fractureB.basis : "算出不可");
  add("応力増加速度", A.rampRate ? fmtNum(A.rampRate.value, 2) : "", "MPa/s", A.rampRate ? A.rampRate.basis : "算出不可");
  add("ヤング率 E", A.youngs ? fmtNum(A.youngs.nmm2, 0) : "", "N/mm2", A.linear ? `弾性勾配 ${fmtNum(A.linear.slope, 2)} (N/mm² per ε%) × 100` : "算出不可");
  add("ヤング率 E", A.youngs ? fmtNum(A.youngs.gpa, 1) : "", "GPa", A.youngs ? "N/mm² を 1/1000 して換算" : "算出不可");
  add("ひずみ速度①（弾性）", A.strainRate1 ? A.strainRate1.value.toExponential(3) : "", "/sec", A.strainRate1 ? A.strainRate1.basis : "算出不可");
  add("ひずみ速度②（塑性）", A.strainRate2 ? A.strainRate2.value.toExponential(3) : "", "/sec", A.strainRate2 ? A.strainRate2.basis : "算出不可");
  add("直線性 R²", A.linear ? A.linear.r2.toFixed(5) : "", "−", A.linear ? A.linear.basis : "算出不可");
  add("判定", A.verdict ? A.verdict.label : "", "−", A.verdict ? A.verdict.checks.map((c) => `${c.label}: ${c.detail}`).join(" / ") : "");
  return rows;
}

/* ───────────────── 17. CSV 入力（§11.1 / 列マッピング・文字コード自動判別） ───────────────── */
const CSV_ROLES = [
  { role: "time",         label: "時間",     unit: "sec",    pats: [/^時間/, /^時刻/, /time/i, /^t$/i] },
  { role: "force",        label: "試験力",   unit: "N",      pats: [/^試験力/, /^荷重/, /force/i, /^load/i] },
  { role: "stress",       label: "応力",     unit: "N/mm2",  pats: [/^応力/, /stress/i] },
  { role: "displacement", label: "変位計1",  unit: "mm",     pats: [/^変位計/, /^伸び計/, /extensometer/i, /^変位/, /^伸び/] },
  { role: "stroke",       label: "ストローク", unit: "mm",   pats: [/^ストローク/, /stroke/i, /クロスヘッド/] },
];
function decodeTextAuto(bytes) {
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return { text: new TextDecoder("utf-8").decode(bytes.subarray(3)), enc: "UTF-8（BOM 検出）" };
  }
  for (const [label, name] of [["utf-8", "UTF-8（strict 判定）"], ["shift_jis", "Shift_JIS"], ["euc-jp", "EUC-JP"]]) {
    try {
      const text = new TextDecoder(label, { fatal: true }).decode(bytes);
      return { text, enc: name };
    } catch (_) { /* 次の候補へ */ }
  }
  return { text: new TextDecoder("utf-8").decode(bytes), enc: "UTF-8（不正バイトは置換）" };
}
function splitCsvLine(line) {
  const out = [];
  let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === "," || c === "\t") { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
const toNumber = (s) => {
  if (s == null) return NaN;
  const t = String(s).replace(/[, ]/g, "").trim();
  if (!t || !/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t)) return NaN;
  return parseFloat(t);
};
/** CSV テキスト → {headers, headerRow, rows(生行), map(role→列index)} */
function parseInputCsv(text) {
  const lines = text.split(/\r\n|\n|\r/).filter((l, i, a) => l.length > 0 || i < a.length - 1);
  const cells = lines.map(splitCsvLine);
  let headerRow = -1, bestScore = 0, bestMap = null;
  const limit = Math.min(cells.length, 40);
  for (let r = 0; r < limit; r++) {
    const hdr = cells[r].map((h) => h.trim());
    if (hdr.filter(Boolean).length < 2) continue;
    const used = new Set();
    const map = {};
    let score = 0;
    for (const spec of CSV_ROLES) {
      let pick = -1, pri = 99;
      hdr.forEach((h, ci) => {
        if (!h || used.has(ci)) return;
        spec.pats.forEach((p, pi) => {
          if (p.test(h) && pi < pri) { pri = pi; pick = ci; }
        });
      });
      if (pick >= 0) { map[spec.role] = pick; used.add(pick); score++; }
    }
    if (score > bestScore) { bestScore = score; headerRow = r; bestMap = map; }
  }
  if (headerRow < 0 || !bestMap || bestMap.force == null) {
    return { ok: false, reason: "ヘッダ行から「試験力」に相当する列を特定できませんでした" };
  }
  const headers = cells[headerRow].map((h) => h.trim());
  const rows = [];
  for (let r = headerRow + 1; r < cells.length; r++) {
    const v = toNumber(cells[r][bestMap.force]);
    if (!isFinite(v)) continue;                       // 単位行・空行などは読み飛ばす
    rows.push(cells[r]);
  }
  return { ok: true, headers, headerRow, rows, map: bestMap };
}
function csvColumns(parsed, map) {
  const n = parsed.rows.length;
  const cols = {};
  for (const spec of CSV_ROLES) {
    const ci = map[spec.role];
    if (ci == null || ci < 0) { cols[spec.role] = null; continue; }
    const arr = new Float64Array(n);
    for (let i = 0; i < n; i++) arr[i] = toNumber(parsed.rows[i][ci]);
    cols[spec.role] = arr;
  }
  return cols;
}
/* ───────────────── 18. 線図（内蔵 Canvas レンダラ・外部ライブラリなし） ───────────────── */
function niceTicks(min, max, count) {
  if (!(isFinite(min) && isFinite(max))) return [];
  if (min === max) { min -= 0.5; max += 0.5; }
  const span = max - min;
  const raw = span / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-6; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}
function tickLabel(v, step) {

class LineChart {
  constructor(host) {
    this.host = host;
    this.canvas = document.createElement("canvas");
    this.ctx = this.canvas.getContext("2d");
    this.tip = document.createElement("div");
    this.tip.className = "chart__tip";
    this.tip.hidden = true;
    host.append(this.canvas, this.tip);
    this.spec = null;
    this.hover = null;
    this.ro = new ResizeObserver(() => this.draw());
    this.ro.observe(host);
    this.canvas.addEventListener("mousemove", (e) => this.onMove(e));
    this.canvas.addEventListener("mouseleave", () => { this.hover = null; this.tip.hidden = true; this.draw(); });
  }
  destroy() { this.ro.disconnect(); this.host.innerHTML = ""; }
  setData(spec) { this.spec = spec; this.hover = null; this.tip.hidden = true; this.draw(); }

  bounds() {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const s of this.spec.series) {
      if (s.scale === false || !s.xs.length) continue;
      for (let i = 0; i < s.xs.length; i++) {
        const x = s.xs[i], y = s.ys[i];
        if (!fin(x) || !fin(y)) continue;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    if (!isFinite(x0)) return null;
    const mx = (x1 - x0) * 0.04 || 1, my = (y1 - y0) * 0.04 || 1;   // 実データに 4% マージン
    return { x0: x0 - mx, x1: x1 + mx, y0: y0 - my, y1: y1 + my };
  }

  draw() {
    const spec = this.spec;
    if (!spec) return;
    const w = this.host.clientWidth, h = this.host.clientHeight;
    if (w < 40 || h < 40) return;
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(h * dpr);
    this.canvas.style.width = w + "px";
    this.canvas.style.height = h + "px";
    const ctx = this.ctx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const fs = cssNum("--chart-fs") || 11;
    ctx.font = `${fs}px ${cssVar("--font")}`;
    const padL = cssNum("--chart-pad-l"), padR = cssNum("--chart-pad-r");
    const padT = cssNum("--chart-pad-t"), padB = cssNum("--chart-pad-b");
    const pw = w - padL - padR, ph = h - padT - padB;
    if (pw < 20 || ph < 20) return;

    const ink = cssVar("--chart-ink"), grid = cssVar("--chart-grid"), axis = cssVar("--chart-axis");
    const b = this.bounds();
    if (!b) {
      ctx.fillStyle = ink;
      ctx.textAlign = "center";
      ctx.fillText("描画できるデータ点がありません", w / 2, h / 2);
      return;
    }
    const X = (v) => padL + ((v - b.x0) / (b.x1 - b.x0)) * pw;
    const Y = (v) => padT + ph - ((v - b.y0) / (b.y1 - b.y0)) * ph;
    this.map = { X, Y, b, padL, padT, pw, ph };

    /* 直線域バンド */
    for (const band of spec.bands || []) {
      if (!fin(band.from) || !fin(band.to)) continue;
      const xa = Math.max(padL, X(band.from)), xb = Math.min(padL + pw, X(band.to));
      if (xb <= xa) continue;
      ctx.fillStyle = cssVar("--chart-band");
      ctx.fillRect(xa, padT, xb - xa, ph);
    }

    /* グリッド・目盛 */
    const xt = niceTicks(b.x0, b.x1, Math.max(3, Math.min(8, Math.round(pw / 90))));
    const yt = niceTicks(b.y0, b.y1, Math.max(3, Math.min(7, Math.round(ph / 46))));
    const xs = xt.length > 1 ? xt[1] - xt[0] : 1, ys = yt.length > 1 ? yt[1] - yt[0] : 1;
    ctx.lineWidth = 1;
    ctx.strokeStyle = grid;
    ctx.beginPath();
    for (const t of xt) { const x = Math.round(X(t)) + 0.5; ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); }

    ctx.fillStyle = ink;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    for (const t of xt) ctx.fillText(tickLabel(t, xs), X(t), padT + ph + 6);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (const t of yt) ctx.fillText(tickLabel(t, ys), padL - 7, Y(t));

    ctx.stroke();
    ctx.fillStyle = ink;
    ctx.textAlign = "right";
    ctx.textBaseline = "alphabetic";

    ctx.textBaseline = "top";
    ctx.fillText(spec.yLabel, 0, 0);

    /* 系列 */

    ctx.beginPath();
